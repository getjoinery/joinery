// joinery-android: the reusable core library. Carries no brand knowledge —
// every app consumes it unchanged and injects a JoineryConfig.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.getjoinery.android"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Kotlin 1.9.24 -> Compose compiler 1.5.14.
        kotlinCompilerExtensionVersion "1.5.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    // The shared vault vectors are read in place from the web tree, so the
    // browser, PHP, Rust, iOS and Android all open the very same bytes.
    sourceSets {
        test {
            resources.srcDirs += [
                rootProject.file("../public_html/tests/vault/fixtures"),
                rootProject.file("../public_html/plugins/mailbox/tests/fixtures"),
            ]
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.2"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // Authenticated webview: pull-to-refresh wrapper for the WebView, and Custom
    // Tabs for off-site links leaving the app.
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.browser:browser:1.8.0"

    // Keystore-backed EncryptedSharedPreferences — secrets never touch plain prefs.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    api "com.squareup.okhttp3:okhttp:4.12.0"

    // Fortress custody (specs/fortress_mobile_apps.md): X25519, HKDF and Ed25519
    // before API 33 (Tink); the biometric gate on the Keystore key that wraps
    // the device and mail secrets (BiometricPrompt needs a FragmentActivity);
    // WorkManager for the new-mail check.
    api "com.google.crypto.tink:tink-android:1.13.0"
    api "androidx.biometric:biometric:1.1.0"
    api "androidx.fragment:fragment-ktx:1.8.1"
    api "androidx.work:work-runtime-ktx:2.9.0"
    implementation "androidx.lifecycle:lifecycle-process:2.8.2"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
