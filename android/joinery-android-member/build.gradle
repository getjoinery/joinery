// joinery-android-member: the native member surfaces (profile dashboard,
// orders, subscriptions, my events, conversations, security), layered on
// joinery-android. Brand-free — an app opts in by depending on this module and
// calling JoineryMember.registerScreens() at launch; the server's member
// navigation destinations then render natively.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    // Distinct from the member APP module (com.getjoinery.member) — AGP
    // forbids two modules sharing a namespace. Mirrors the iOS "JoineryMemberKit".
    namespace "com.getjoinery.memberkit"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Kotlin 1.9.24 -> Compose compiler 1.5.14.
        kotlinCompilerExtensionVersion "1.5.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    api project(":joinery-android")

    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // Pure-Java QR encoder for the native TOTP setup QR (the server sends the
    // otpauth:// URI, not an image). No Android dependencies.
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    // The store race test constructs a MemberApi (which wraps ApiClient →
    // OkHttpClient); OkHttp must be on the unit-test classpath to resolve it.
    testImplementation "com.squareup.okhttp3:okhttp:4.12.0"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
