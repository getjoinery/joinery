# Joinery log rotation configuration
# Installed by site_housekeeping.sh — rotates the site's logs. Runs as www-data:www-data, the
# owner of a site's logs on every install; a group the machine lacks makes logrotate refuse the
# block and the whole logrotate.service fail. Every block says so: the logs directory is
# www-data's and group-writable, and logrotate running as root refuses any block there
# without an su line.
# The {{SITE_ROOT}} placeholder is replaced during installation

{{SITE_ROOT}}/logs/error.log {
    su www-data www-data
    weekly
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 20M
}

# Apache's request log grows with every request. Renamed, never copied: a log
# that grew for months is gigabytes, and copying it needs that much free disk.
# Apache keeps writing the renamed file until the reload, so it is compressed
# one rotation later.
{{SITE_ROOT}}/logs/access.log {
    su www-data www-data
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0660 www-data www-data
    size 50M
    sharedscripts
    postrotate
        if pgrep -f ^/usr/sbin/apache2 > /dev/null; then
            apache2ctl graceful > /dev/null 2>&1 || true
        fi
    endscript
}

{{SITE_ROOT}}/logs/cron_scheduled_tasks.log {
    su www-data www-data
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 10M
}

{{SITE_ROOT}}/logs/host_converger.log {
    su www-data www-data
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 5M
}
