#Version 1.03
# 1.03 - www.{{DOMAIN_NAME}} has its own :443 host under the certificate guard,
#        on the same certificate, answering only with a 308 to the apex. With
#        none, a TLS connection whose SNI is www matched no :443 host and Apache
#        handed it to the first :443 host on the address - on the shared Docker
#        host, another site's certificate and container (specs/implemented/tls_and_origin_trust.md
#        B11).
# 1.02 - The :443 host answers from the first minute: it reads the Let's
#        Encrypt lineage when one exists and the self-signed placeholder
#        (/etc/ssl/joinery/<domain>, minted at install and on every converge)
#        otherwise, chosen by a per-site Define. A box with no :443 listener
#        cannot get its first certificate through an edge that redirects the
#        challenge to https (specs/implemented/tls_and_origin_trust.md B10). The :80 ->
#        https redirect stays guarded on the Let's Encrypt path alone: a
#        placeholder must never pull a direct visitor onto a certificate their
#        browser will warn about.
# Universal Joinery reverse-proxy vhost (Docker / containerised sites).
#
# Same envelope as default_virtualhost.conf:
#   :80 with CF-Visitor-guarded HTTP->HTTPS redirect (loop-safe under CF Flexible),
#   :443 reading the Let's Encrypt lineage, else the placeholder,
#   www.{{DOMAIN_NAME}} -> {{DOMAIN_NAME}} canonical redirect on :80 and :443.
#
# Differs from default_virtualhost.conf only in the site-specific block:
# this one proxies to a localhost port instead of serving from a DocumentRoot.

<VirtualHost *:80>
    ServerName {{DOMAIN_NAME}}

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:{{PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{PORT}}/

    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On
    # Redirect only when there is somewhere to redirect TO — the :443 vhost below
    # exists only when an origin cert does. Without this, a site with no cert
    # answers every HTTP request with a permanent redirect to a port serving
    # nothing.
    #
    # Deliberately no X-Forwarded-Proto condition here, unlike
    # default_virtualhost.conf: this vhost sets that header itself a few lines
    # up, and whether mod_headers has applied it by the time mod_rewrite reads it
    # is phase-order dependent. If it has, the condition is always false and the
    # redirect silently never fires. CF-Visitor is set by the client side of the
    # proxy, so it has no such ambiguity.
    <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteCond %{HTTP:CF-Visitor} !"scheme":"https"
    RewriteCond %{SERVER_NAME} ={{DOMAIN_NAME}}
    # 308, not 301: a redirected POST must keep its method and body. A 301
    # or 302 makes the browser re-issue as GET and discard what was typed,
    # so a form submitted the instant this redirect appears is swallowed
    # silently -- no error, no login, back to the same page. That is not
    # theoretical: a deferred certificate arrived between a login page being
    # loaded over http and its form being submitted, and the credentials
    # were dropped in flight. 308 has the same permanent semantics and is
    # understood by every browser that matters.
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=308]
    </IfFile>
</VirtualHost>

# Which certificate directory the :443 host reads: the Let's Encrypt lineage
# when one exists, the placeholder otherwise. Apache evaluates <IfFile> and
# Define at config-parse time, so the switch happens on the reload after a
# certificate lands. The variable carries the site name so two sites on one
# host never collide. With neither file (openssl missing at install) there is
# no :443 host and no parse error; the site answers on :80.
Define JOINERY_CERT_DIR_{{SITE_NAME}} /etc/ssl/joinery/{{DOMAIN_NAME}}
<IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
Define JOINERY_CERT_DIR_{{SITE_NAME}} /etc/letsencrypt/live/{{DOMAIN_NAME}}
</IfFile>
<IfFile ${JOINERY_CERT_DIR_{{SITE_NAME}}}/fullchain.pem>
<VirtualHost *:443>
    ServerName {{DOMAIN_NAME}}

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:{{PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{PORT}}/

    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile ${JOINERY_CERT_DIR_{{SITE_NAME}}}/fullchain.pem
    SSLCertificateKeyFile ${JOINERY_CERT_DIR_{{SITE_NAME}}}/privkey.pem
</VirtualHost>

# www -> bare domain redirect, one port up. A TLS connection whose SNI is
# www.{{DOMAIN_NAME}} has to match a :443 host of its own: with none, Apache
# hands it to the FIRST :443 host on the address, which on a shared Docker
# host is another site's certificate and another site's container. Same
# certificate (it names www), and nothing served here but the redirect.
<VirtualHost *:443>
    ServerName www.{{DOMAIN_NAME}}
    SSLEngine on
    SSLCertificateFile ${JOINERY_CERT_DIR_{{SITE_NAME}}}/fullchain.pem
    SSLCertificateKeyFile ${JOINERY_CERT_DIR_{{SITE_NAME}}}/privkey.pem
    Redirect 308 / https://{{DOMAIN_NAME}}/
</VirtualHost>
</IfFile>

# Canonical-host redirect: www.{{DOMAIN_NAME}} -> {{DOMAIN_NAME}}.
# Harmless if www.{{DOMAIN_NAME}} doesn't resolve anywhere; standard pattern
# across the fleet so every vhost file has the same shape.
<VirtualHost *:80>
    ServerName www.{{DOMAIN_NAME}}
    RewriteEngine On
    # The scheme this host can actually answer on: https once an origin cert
    # exists, plain http until then. A fixed https target on a certless site just
    # moves the dead end one hop.
    <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteRule ^(.*)$ https://{{DOMAIN_NAME}}$1 [R=308,L]
    </IfFile>
    <IfFile !/etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteRule ^(.*)$ http://{{DOMAIN_NAME}}$1 [R=308,L]
    </IfFile>
</VirtualHost>
