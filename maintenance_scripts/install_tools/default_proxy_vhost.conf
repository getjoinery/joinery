#Version 1.01
# Universal Joinery reverse-proxy vhost (Docker / containerised sites).
#
# Same envelope as default_virtualhost.conf:
#   :80 with CF-Visitor-guarded HTTP->HTTPS redirect (loop-safe under CF Flexible),
#   :443 wrapped in <IfFile> (only activates if an origin cert exists),
#   www.{{DOMAIN_NAME}} -> {{DOMAIN_NAME}} canonical redirect.
#
# Differs from default_virtualhost.conf only in the site-specific block:
# this one proxies to a localhost port instead of serving from a DocumentRoot.

<VirtualHost *:80>
    ServerName {{DOMAIN_NAME}}

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:{{PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{PORT}}/

    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On
    # Redirect only when there is somewhere to redirect TO — the :443 vhost below
    # exists only when an origin cert does. Without this, a site with no cert
    # answers every HTTP request with a permanent redirect to a port serving
    # nothing.
    #
    # Deliberately no X-Forwarded-Proto condition here, unlike
    # default_virtualhost.conf: this vhost sets that header itself a few lines
    # up, and whether mod_headers has applied it by the time mod_rewrite reads it
    # is phase-order dependent. If it has, the condition is always false and the
    # redirect silently never fires. CF-Visitor is set by the client side of the
    # proxy, so it has no such ambiguity.
    <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteCond %{HTTP:CF-Visitor} !"scheme":"https"
    RewriteCond %{SERVER_NAME} ={{DOMAIN_NAME}}
    # 308, not 301: a redirected POST must keep its method and body. A 301
    # or 302 makes the browser re-issue as GET and discard what was typed,
    # so a form submitted the instant this redirect appears is swallowed
    # silently -- no error, no login, back to the same page. That is not
    # theoretical: a deferred certificate arrived between a login page being
    # loaded over http and its form being submitted, and the credentials
    # were dropped in flight. 308 has the same permanent semantics and is
    # understood by every browser that matters.
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=308]
    </IfFile>
</VirtualHost>

# :443 only activates when an origin cert exists at the standard path.
# Apache evaluates <IfFile> at config-parse time, so missing cert = block
# silently skipped, no parse error. Any TLS-terminating proxy in front
# (Cloudflare etc.) still handles HTTPS at the edge.
<IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
<VirtualHost *:443>
    ServerName {{DOMAIN_NAME}}

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:{{PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{PORT}}/

    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/privkey.pem
</VirtualHost>
</IfFile>

# Canonical-host redirect: www.{{DOMAIN_NAME}} -> {{DOMAIN_NAME}}.
# Harmless if www.{{DOMAIN_NAME}} doesn't resolve anywhere; standard pattern
# across the fleet so every vhost file has the same shape.
<VirtualHost *:80>
    ServerName www.{{DOMAIN_NAME}}
    RewriteEngine On
    # The scheme this host can actually answer on: https once an origin cert
    # exists, plain http until then. A fixed https target on a certless site just
    # moves the dead end one hop.
    <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteRule ^(.*)$ https://{{DOMAIN_NAME}}$1 [R=308,L]
    </IfFile>
    <IfFile !/etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
    RewriteRule ^(.*)$ http://{{DOMAIN_NAME}}$1 [R=308,L]
    </IfFile>
</VirtualHost>
