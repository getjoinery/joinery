#Version 2.05
# 2.05 - The :443 host states its own TLS policy: no TLS 1.0/1.1, forward-secret
#        AEAD ciphers only, no session tickets. Apache's stock ssl.conf allows
#        every protocol but SSLv3, and the only nodes that had a policy were the
#        ones certbot --apache had edited by hand; the fleet had none. The
#        /uploads/ fallback keeps the visitor's scheme: behind a proxy it sent
#        https visitors to http, which a browser blocks as mixed content.
# 2.04 - AllowOverride None everywhere, and static_files never executes PHP
#        (specs/read_only_tree.md). The rewrite already lives in the <Directory>
#        blocks below and no .htaccess exists in public_html, so All bought
#        nothing there. Under static_files it bought something bad: that
#        directory is the web user's to write, FileInfo let a .htaccess dropped
#        into it SetHandler anything, and the global php-fpm handler meant a
#        .php file written there ran. The /uploads/ fallback that used to live
#        in static_files/uploads/.htaccess is below, in the vhost, where the web
#        user cannot edit it.
# Universal Joinery bare-metal vhost.
#
# Main site lives on both :80 and :443. The :80 vhost has the
# CF-Visitor-guarded HTTP->HTTPS redirect so it cannot loop under
# Cloudflare Flexible-mode SSL. SSL paths point at the standard
# certbot location; whatever cert provision_origin_cert puts there
# (LE HTTP-01, LE DNS-01, or self-signed fallback) makes both
# vhosts load identically.
#
# Test site and www-redirect aux vhosts are kept for parity with
# existing installs; they do not need the cert path and are HTTP-only.

<Directory /var/www/html/{{SITE_NAME}}/public_html>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride None
        Require all granted
	# Turn mod_rewrite on
	RewriteEngine On
	RewriteBase /

    RewriteCond %{REQUEST_URI} !^/serve\.php$
    RewriteRule ^(.*)$ serve.php?__route=$1 [QSA,L]

</Directory>

<Directory /var/www/html/{{SITE_NAME}}_test/public_html>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride None
        Require all granted
	# Turn mod_rewrite on
	RewriteEngine On
	RewriteBase /

    RewriteCond %{REQUEST_URI} !^/serve\.php$
    RewriteRule ^(.*)$ serve.php?__route=$1 [QSA,L]

</Directory>

# Main site — HTTP. Serves directly when this host has no origin cert, and
# redirects to HTTPS once it has one. Guards also skip the redirect when a proxy
# in front already gave the client HTTPS — Cloudflare marks that with
# CF-Visitor, a host-level reverse proxy with X-Forwarded-Proto.
<VirtualHost {{SERVER_IP}}:80>

		# Static files alias for public assets
		Alias /static_files /var/www/html/{{SITE_NAME}}/static_files
		<Directory "/var/www/html/{{SITE_NAME}}/static_files">
			Options -Indexes
			AllowOverride None
			Require all granted

			# This directory is data the web server writes: uploads, published
			# archives, cached assets. Nothing in it is ever code. Without this
			# the global php-fpm handler is in force here, so one bug that lets
			# an attacker write a file into it is a PHP shell.
			<FilesMatch "\.ph(?:ar|p|ps|tml|p[0-9])$">
				Require all denied
			</FilesMatch>

			# Previously static_files/uploads/.htaccess. It lives here because
			# .htaccess is read from a directory the web user owns, which makes
			# an attacker who can write one an attacker who can configure Apache.
			# Two rules, one target. A path-only target makes Apache build the
			# Location from the scheme IT spoke, which behind a TLS-terminating
			# proxy is http even when the visitor is on https, and a browser
			# refuses an https page's image that redirects to http. So when the
			# visitor arrived over https (direct, X-Forwarded-Proto, or CF-Visitor),
			# say https; otherwise leave the scheme to Apache. This is not a
			# scheme upgrade and needs no cert guard: it names https only to a
			# visitor already on it. 307: temporary (the file may appear) and
			# method-preserving.
			RewriteEngine On
			RewriteCond %{REQUEST_URI} ^/static_files/uploads/
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{HTTPS} =on [OR]
			RewriteCond %{HTTP:X-Forwarded-Proto} =https [OR]
			RewriteCond %{HTTP:CF-Visitor} scheme":"https
			RewriteRule ^uploads/(.*)$ https://%{HTTP_HOST}/uploads/$1 [R=307,L]
			RewriteCond %{REQUEST_URI} ^/static_files/uploads/
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteRule ^uploads/(.*)$ /uploads/$1 [R=307,L]
		</Directory>


        ServerName {{DOMAIN_NAME}}
        DirectoryIndex index.php index.html
        DocumentRoot /var/www/html/{{SITE_NAME}}/public_html
        ErrorLog /var/www/html/{{SITE_NAME}}/logs/error.log
        CustomLog /var/www/html/{{SITE_NAME}}/logs/access.log combined

        RewriteEngine On
        # Redirect only when there is somewhere to redirect TO. The :443 vhost
        # below exists only when an origin cert does, so without this guard a
        # site that has no cert — --no-ssl, localhost, an IP, or an issue that
        # failed — answers every HTTP request with a permanent redirect to a port
        # serving nothing. Same file, same condition, so the two cannot disagree.
        <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
        RewriteCond %{HTTP:CF-Visitor} !"scheme":"https"
        RewriteCond %{HTTP:X-Forwarded-Proto} !=https
        RewriteCond %{SERVER_NAME} ={{DOMAIN_NAME}}
        # 308, not 301: a redirected POST must keep its method and body. A 301
        # or 302 makes the browser re-issue as GET and discard what was typed,
        # so a form submitted the instant this redirect appears is swallowed
        # silently -- no error, no login, back to the same page. That is not
        # theoretical: a deferred certificate arrived between a login page being
        # loaded over http and its form being submitted, and the credentials
        # were dropped in flight. 308 has the same permanent semantics and is
        # understood by every browser that matters.
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=308]
        </IfFile>
</VirtualHost>

# Main site — HTTPS. Only activates if an origin cert exists at the standard
# certbot path. Apache evaluates <IfFile> at config-parse time, so missing
# cert just means no :443 vhost (no parse error). CF (or any TLS-terminating
# proxy in front) still handles HTTPS at the edge for sites with no origin cert.
<IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
<VirtualHost {{SERVER_IP}}:443>

		Alias /static_files /var/www/html/{{SITE_NAME}}/static_files
		<Directory "/var/www/html/{{SITE_NAME}}/static_files">
			Options -Indexes
			AllowOverride None
			Require all granted

			# This directory is data the web server writes: uploads, published
			# archives, cached assets. Nothing in it is ever code. Without this
			# the global php-fpm handler is in force here, so one bug that lets
			# an attacker write a file into it is a PHP shell.
			<FilesMatch "\.ph(?:ar|p|ps|tml|p[0-9])$">
				Require all denied
			</FilesMatch>

			# Previously static_files/uploads/.htaccess. It lives here because
			# .htaccess is read from a directory the web user owns, which makes
			# an attacker who can write one an attacker who can configure Apache.
			# Two rules, one target. A path-only target makes Apache build the
			# Location from the scheme IT spoke, which behind a TLS-terminating
			# proxy is http even when the visitor is on https, and a browser
			# refuses an https page's image that redirects to http. So when the
			# visitor arrived over https (direct, X-Forwarded-Proto, or CF-Visitor),
			# say https; otherwise leave the scheme to Apache. This is not a
			# scheme upgrade and needs no cert guard: it names https only to a
			# visitor already on it. 307: temporary (the file may appear) and
			# method-preserving.
			RewriteEngine On
			RewriteCond %{REQUEST_URI} ^/static_files/uploads/
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{HTTPS} =on [OR]
			RewriteCond %{HTTP:X-Forwarded-Proto} =https [OR]
			RewriteCond %{HTTP:CF-Visitor} scheme":"https
			RewriteRule ^uploads/(.*)$ https://%{HTTP_HOST}/uploads/$1 [R=307,L]
			RewriteCond %{REQUEST_URI} ^/static_files/uploads/
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteRule ^uploads/(.*)$ /uploads/$1 [R=307,L]
		</Directory>

        ServerName {{DOMAIN_NAME}}
        DirectoryIndex index.php index.html
        DocumentRoot /var/www/html/{{SITE_NAME}}/public_html
        ErrorLog /var/www/html/{{SITE_NAME}}/logs/error.log
        CustomLog /var/www/html/{{SITE_NAME}}/logs/access.log combined

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/privkey.pem
        # The TLS policy, stated here rather than inherited: Apache's stock
        # ssl.conf permits TLS 1.0 and 1.1 and any HIGH cipher. This is the
        # certbot/Mozilla intermediate set - forward-secret AEAD suites only,
        # the client picks the order, no session tickets (a ticket key that
        # never rotates undoes forward secrecy).
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        SSLHonorCipherOrder off
        SSLSessionTickets off
</VirtualHost>
</IfFile>

# Test site — HTTP only.
<VirtualHost {{SERVER_IP}}:80>
        ServerName test.{{DOMAIN_NAME}}
        DirectoryIndex index.php index.html
        DocumentRoot /var/www/html/{{SITE_NAME}}_test/public_html
        ErrorLog /var/www/html/{{SITE_NAME}}_test/logs/error.log
        CustomLog /var/www/html/{{SITE_NAME}}_test/logs/access.log combined
</VirtualHost>

# www -> bare domain redirect. Sends visitors to the scheme this host can
# actually answer on: https once an origin cert exists, plain http until then.
# A fixed https target on a certless site just moves the dead end one hop.
<VirtualHost {{SERVER_IP}}:80>
        ServerName www.{{DOMAIN_NAME}}
        RewriteEngine On
        <IfFile /etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
        RewriteRule ^(.*)$ https://{{DOMAIN_NAME}}$1 [R=308,L]
        </IfFile>
        <IfFile !/etc/letsencrypt/live/{{DOMAIN_NAME}}/fullchain.pem>
        RewriteRule ^(.*)$ http://{{DOMAIN_NAME}}$1 [R=308,L]
        </IfFile>
</VirtualHost>
