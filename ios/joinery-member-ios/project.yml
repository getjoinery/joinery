# Joinery member app — the reference brand target on JoineryKit.
# Regenerate the Xcode project with:
#   ~/dev/.tools/xcodegen/xcodegen/bin/xcodegen generate
name: JoineryMember
options:
  bundleIdPrefix: com.getjoinery
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    # Apple's recommended project settings, set here so xcodegen always emits
    # them (Xcode's "update to recommended settings" nag stops). Both are safe
    # for this app: no custom run-script phases for the sandbox to guard, and no
    # asset catalog for the symbol extensions to generate.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  JoineryKit:
    path: ../joinery-kit
targets:
  JoineryMember:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    # Keys GENERATE_INFOPLIST_FILE cannot express (arrays), merged with the
    # generated ones: the mail poll's background task and Face ID's reason
    # (specs/fortress_mobile_apps.md § R3, R15).
    info:
      path: Sources/Info.plist
      properties:
        NSFaceIDUsageDescription: Your end-to-end encrypted mail key stays on this phone behind Face ID.
        BGTaskSchedulerPermittedIdentifiers: [com.getjoinery.mail.poll]
        UIBackgroundModes: [fetch]
        # The person's own AI model may answer over plain http on their own
        # network (an Ollama at 192.168.x.x or a tailnet IP). Local networking
        # only; the site itself is https-only in APIClient.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Your own AI model on your network judges your end-to-end encrypted mail.
    dependencies:
      - package: JoineryKit
        product: JoineryKit
      - package: JoineryKit
        product: JoineryMailKit
      - package: JoineryKit
        product: JoineryCalendarKit
      - package: JoineryKit
        product: JoineryAIChatKit
      - package: JoineryKit
        product: JoineryMemberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getjoinery.member
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Joinery
        # iPad supports all four orientations so the app is eligible for
        # Split View / Slide Over multitasking (no UIRequiresFullScreen opt-out).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J634NTDX3D
  JoineryMemberUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [UITests]
    dependencies:
      - target: JoineryMember
