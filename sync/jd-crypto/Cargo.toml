[package]
name = "jd-crypto"
description = "Native reimplementation of VaultCrypto + DriveCrypto (client-custody browser crypto). Must byte-match assets/js/vault-crypto.js and drive-crypto.js — parity enforced by tests/functional/drive/sync_crypto_parity_gate.sh."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "jd-crypto-parity"
path = "src/bin/parity.rs"
