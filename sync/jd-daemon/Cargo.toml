[package]
name = "jd-daemon"
description = "The Joinery Drive client as a program: the device-link ceremony, the loop that runs the engine, the health model behind the tray, and the local control channel the shells talk to."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jd-core = { path = "../jd-core" }
jd-crypto = { path = "../jd-crypto" }
jd-platform = { path = "../jd-platform" }
jd-proto = { path = "../jd-proto" }
jd-vfs = { path = "../jd-vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# The asking half of the control channel. Already in the dependency tree for the
# server API, so it costs nothing here.
ureq = { version = "2", features = ["json"] }
# The update feed: Ed25519 signatures and SHA-256 (`src/update`). Both already in
# the tree under the TLS stack, so neither is a new thing to build or audit.
ring = "0.17"
# The update payload is a gzipped tar; already in the tree under the tray icons.
flate2 = "1"

[dev-dependencies]
# The engine's mock server, spoken to over loopback HTTP so a test can run a
# real daemon's passes against it (`daemon::tests`). Never in a build.
jd-sim = { path = "../jd-sim" }

[[bin]]
name = "joinery-drive"
path = "src/main.rs"

# The publisher's tool: packs an update payload, writes the channel manifest,
# and signs it with a key it is given. Never shipped to users.
[[bin]]
name = "joinery-drive-release"
path = "src/bin/joinery_drive_release.rs"

[features]
default = []
# Passed through to jd-platform: use the Linux Secret Service where one exists.
secret-service = ["jd-platform/secret-service"]
