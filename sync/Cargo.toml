
# Joinery Drive sync clients — Rust workspace (specs/drive_sync_clients.md).
# Crates join the members list as their phase lands:
#   jd-proto, jd-vfs, jd-platform, jd-core, jd-sim, jd-daemon, jd-shell
[workspace]
resolver = "2"
members = [
    "jd-crypto",
    "jd-proto",
    "jd-vfs",
    "jd-platform",
    "jd-core",
    "jd-daemon",
    "jd-shell",
    "jd-sim",
    "jd-soak",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"

# Test binaries here statically link SQLite and ring, so full debug info made
# each one 60+MB and cargo keeps every stale copy. Line tables still give
# backtraces file and line numbers, which is all the gates ever read.
[profile.dev]
debug = "line-tables-only"

# The simulator gate (sync_sim_gate.sh) runs seeded workloads that are pure
# computation — minutes at opt-level 0, a third of that optimised. Its own
# profile, so it builds into target/sim and leaves the debug builds the other
# gates share untouched.
[profile.sim]
inherits = "dev"
opt-level = 2
