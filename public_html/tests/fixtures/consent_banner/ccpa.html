<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Consent banner fixtures (ccpa)</title>
<!--
	Browser-side fixture for assets/js/consent.js in ccpa mode, read by
	tests/unit/consent_banner_test.php. joineryApi is stubbed; a held-back
	analytics tag sets window.__ran when consent releases it.
-->
<script>
	// A file:// page has no real cookie store, and reading document.cookie
	// there stalls headless Chrome for about 25 s: an in-memory jar instead.
	(function () {
		var jar = {};
		Object.defineProperty(document, 'cookie', {
			get: function () { return Object.keys(jar).map(function (k) { return k + '=' + jar[k]; }).join('; '); },
			set: function (v) { var kv = String(v).split(';')[0], i = kv.indexOf('='); jar[kv.slice(0, i).trim()] = kv.slice(i + 1); }
		});
	})();
	window.__posts = [];
	window.joineryApi = { post: function (a, b) { window.__posts.push(a + ':' + JSON.stringify(b)); return Promise.resolve({}); } };
</script>
</head>
<body>
<ul id="results"></ul>
<a href="#" data-joinery-cc-manage id="ccpa-link">Do Not Sell or Share My Personal Information</a>
<script type="text/plain" data-joinery-consent="analytics">window.__ran = (window.__ran || 0) + 1;</script>
<script type="application/json" id="joinery-consent-config">{"enabled":true,"mode":"ccpa","privacyPolicyUrl":"/privacy\" onmouseover=\"x"}</script>
<script src="../../../assets/js/consent.js"></script>
<script src="driver.js"></script>
</body>
</html>
